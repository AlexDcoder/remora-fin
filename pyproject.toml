[project]
name = "remora"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    { name = "Alex", email = "alexandrepinto586@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.84",
    "polars>=1.39.3",
    "python-dotenv>=1.2.2",
    "rich>=14.3.3",
    "rich-argparse>=1.7.2",
    "textual>=8.2.3",
]

[project.scripts]
remora = "remora.cli:execute_cli"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"
