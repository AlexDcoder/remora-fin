[project]
name = "remora-fin"
version = "1.0.5"
description = "Lightweight, high-performance FinOps toolkit for AWS"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    { name = "Alex", email = "alexandrepinto586@gmail.com" }
]
requires-python = ">=3.12,<3.14"
keywords = [
    "aws",
    "finops",
    "cost-management",
    "cloud",
    "billing",
    "anomaly-detection",
    "cost-explorer",
    "forecasting",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "aioboto3>=15.0.0",
    "boto3>=1.40.0",
    "polars>=1.39.3",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "rich>=14.3.3",
    "rich-argparse>=1.7.2",
    "textual>=8.2.3",
    "fpdf2>=2.8.2",
    "pypdf>=6.11.0",
    "argcomplete>=3.2.0",
    "openpyxl>=3.1.5",
    "xlsxwriter>=3.2.9",
]

[project.urls]
Homepage = "https://github.com/AlexDcoder/remora-fin"
Documentation = "https://github.com/AlexDcoder/remora-fin#readme"
Repository = "https://github.com/AlexDcoder/remora-fin"
Issues = "https://github.com/AlexDcoder/remora-fin/issues"
Changelog = "https://github.com/AlexDcoder/remora-fin/releases"

[project.scripts]
remora-fin = "remora_fin.cli:execute_cli"

[build-system]
requires = ["uv-build>=0.11.19"]
build-backend = "uv_build"

# -- Native UV Build Tool Settings --
[tool.uv.build-backend]
packages = ["src/remora_fin"]
source-exclude = [
    "/.github",
    "/tests",
]

# -- Tool Configurations --

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]
extend-exclude = ["src/remora_fin/cli.py"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "RUF",   # ruff-specific rules
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # line length (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["remora_fin"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["src/remora_fin"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "remora_fin.services.*"
disallow_untyped_defs = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "remora_fin.ui.*"
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--cov=remora_fin",
    "--cov-report=term-missing",
    "--no-cov-on-fail",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "moto[all]>=5.0.0",
    "pytest-asyncio>=0.25.0",
    "boto3-stubs[budgets,ce,organizations,pricing,s3,sts]>=1.43.24",
]