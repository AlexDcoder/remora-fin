version: 2
updates:
  # Python dependencies via pyproject.toml
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "Alex"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    allow:
      # Only direct dependencies from pyproject.toml
      - dependency-name: "aioboto3"
      - dependency-name: "boto3"
      - dependency-name: "boto3-stubs"
      - dependency-name: "fpdf2"
      - dependency-name: "plotext"
      - dependency-name: "polars"
      - dependency-name: "pydantic"
      - dependency-name: "python-dotenv"
      - dependency-name: "rich"
      - dependency-name: "rich-argparse"
      - dependency-name: "seaborn"
      - dependency-name: "textual"
      - dependency-name: "textual-plotext"
      - dependency-name: "ruff"
      - dependency-name: "mypy"
      - dependency-name: "pytest"
      - dependency-name: "pytest-cov"
      - dependency-name: "moto"
      - dependency-name: "pytest-asyncio"
    ignore:
      # Defer major version updates for manual review
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    reviewers:
      - "Alex"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
