name: Auto-Fix Lint & Format Status

on:
  pull_request_target:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  auto-fix:
    name: Auto-Fix Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the head repo and ref securely so changes can be committed back
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: ".python-version"

      - run: uv sync --all-extras --frozen

      - name: Fix Lint Issues
        run: uv run ruff check --fix .
        continue-on-error: true 

      - name: Format Code
        run: uv run ruff format .

      # Commits style updates back to the PR branch safely
      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: automated ruff fixes and formatting"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"