name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: ".python-version"
      - run: uv sync --all-extras
      - run: uv run ruff check src/remora
      - run: uv run ruff format --check src/remora

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: ".python-version"
      - run: uv sync --all-extras
      - run: uv run mypy src/remora --ignore-missing-imports

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: ".python-version"
      - run: uv sync --all-extras
      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            uv run pytest tests/ -v --cov=remora --cov-report=xml
          else
            echo "No tests directory found. Skipping tests."
          fi
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: ".python-version"
      - run: uv build
      - name: Verify build artifacts
        run: |
          ls -la dist/
          test -f dist/*.tar.gz
          test -f dist/*.whl
